name: Install Ice
description: "Install Ice for C++ development"

inputs:
  channel:
    description: "Ice version channel (e.g., 3.8, 3.7)"
    required: false
    default: "3.8"
  quality:
    description: "Package quality: stable or nightly"
    required: false
    default: "stable"

runs:
  using: "composite"
  steps:
    - name: Install Ice Brew Formula
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if [ "${{ inputs.quality }}" = "nightly" ]; then
          brew install zeroc-ice/nightly/ice@${{ inputs.channel }}
        else
          # `ice@3.8` is an alias to the unversioned `ice` formula in zeroc-ice/tap, and
          # Homebrew only auto-trusts a fully-qualified install target that names a real
          # formula file. Installing via the alias therefore hits the new tap-trust check
          # and fails with "Refusing to load formula zeroc-ice/tap/ice from untrusted tap",
          # so we trust our own tap first. See zeroc-ice/homebrew-tap#16.
          brew tap zeroc-ice/tap
          brew trust zeroc-ice/tap
          brew install zeroc-ice/tap/ice@${{ inputs.channel }}
        fi

    - name: Install Ice Linux Repository
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "${{ inputs.quality }}" = "nightly" ]; then
          wget https://download.zeroc.com/ice/nightly/${{ inputs.channel }}/ubuntu24.04/ice-repo-${{ inputs.channel }}-nightly_1.0.0_all.deb -O ice-repo.deb
        else
          wget https://download.zeroc.com/ice/${{ inputs.channel }}/ubuntu24.04/ice-repo-${{ inputs.channel }}_1.0_all.deb -O ice-repo.deb
        fi
        sudo dpkg -i ice-repo.deb
        rm ice-repo.deb

        sudo apt-get update
        sudo apt-get install -y libzeroc-ice-dev
