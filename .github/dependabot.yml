version: 2
updates:
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/js/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]
      js-major:
        update-types: ["major"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      java-minor-and-patch:
        update-types: ["minor", "patch"]
      java-major:
        update-types: ["major"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dotnet-minor-and-patch:
        update-types: ["minor", "patch"]
      dotnet-major:
        update-types: ["major"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      swift-minor-and-patch:
        update-types: ["minor", "patch"]
      swift-major:
        update-types: ["major"]

  # The blocks below mirror the ones above with target-branch: "3.8". 3.8 is a
  # stable release branch, so major version updates are ignored there. Dependabot
  # reads this config from the default branch only, and security updates always
  # target the default branch (they cannot be pointed at 3.8).
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/js/**"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      swift-minor-and-patch:
        update-types: ["minor", "patch"]

  # 3.7 is in maintenance, so only its GitHub Actions are kept up to date.
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.7"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
