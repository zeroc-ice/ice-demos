version: 2

# Dependabot's proxy only lets a job reach hosts on its default allowlist or in a
# registry the job references, so the ZeroC feeds are declared here even though
# they allow anonymous access.
registries:
  zeroc-maven:
    type: maven-repository
    url: https://download.zeroc.com/nexus/repository/maven-3.9-nightly/
  zeroc-npm:
    type: npm-registry
    url: https://download.zeroc.com/nexus/repository/npm-3.9-nightly/
  zeroc-nuget:
    type: nuget-feed
    url: https://download.zeroc.com/nexus/repository/nuget-3.9-nightly/
  # SwiftPM downloads the Ice binary targets from download.zeroc.com. There is no
  # registry type for these, and the proxy allows a registry's host whatever its
  # type, so this entry only serves to allow the host for the swift jobs.
  zeroc-downloads:
    type: maven-repository
    url: https://download.zeroc.com/

updates:
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    # Demo manifests sit two and three levels down. A trailing "**" matches a
    # single level, so the glob has to end in "**/*" to reach them.
    directories:
      - "/js/**/*"
    registries:
      - zeroc-npm
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # typescript majors are gated by typescript-eslint's supported compiler
      # range, and @types/node majors track the Node version in engines and CI.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**/*"
    registries:
      - zeroc-maven
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # 7.40.0 and 7.41.0 depend on a rewrite-bom 8.91.0 that isn't published to Maven
      # Central; drop this once the plugin moves past 7.41.0:
      # https://github.com/openrewrite/rewrite-gradle-plugin/issues/476
      - dependency-name: "org.openrewrite.rewrite:org.openrewrite.rewrite.gradle.plugin"
        versions: ["7.40.0", "7.41.0"]
    groups:
      java:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**/*"
    registries:
      - zeroc-nuget
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**/*"
    registries:
      - zeroc-downloads
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      swift:
        patterns: ["*"]

  # The blocks below mirror the ones above with target-branch: "3.8". 3.8 is a
  # stable release branch, so major version updates are ignored there. Dependabot
  # reads this config from the default branch only, and security updates always
  # target the default branch (they cannot be pointed at 3.8).
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/js/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.openrewrite.rewrite:org.openrewrite.rewrite.gradle.plugin"
        versions: ["7.40.0", "7.41.0"]
    groups:
      java:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**/*"
    target-branch: "3.8"
    registries:
      - zeroc-downloads
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      swift:
        patterns: ["*"]

  # 3.7 is in maintenance, so only its GitHub Actions are kept up to date.
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.7"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
