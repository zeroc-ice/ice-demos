version: 2
updates:
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    # Demo manifests sit two and three levels down. A trailing "**" matches a
    # single level, so the glob has to end in "**/*" to reach them.
    directories:
      - "/js/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # typescript majors are gated by typescript-eslint's supported compiler
      # range, and @types/node majors track the Node version in engines and CI.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # com.android.application majors are gated by the Android demo's
      # migration to AGP's built-in Kotlin support.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
    groups:
      java:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      swift:
        patterns: ["*"]

  # The blocks below mirror the ones above with target-branch: "3.8". 3.8 is a
  # stable release branch, so major version updates are ignored there. Dependabot
  # reads this config from the default branch only, and security updates always
  # target the default branch (they cannot be pointed at 3.8).
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/js/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/python/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directories:
      - "/java/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/csharp/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: "swift"
    directories:
      - "/swift/**/*"
    target-branch: "3.8"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      swift:
        patterns: ["*"]

  # 3.7 is in maintenance, so only its GitHub Actions are kept up to date.
  - package-ecosystem: "github-actions"
    # Two entries are required: "/" is the special value that scans
    # .github/workflows (plus any root action.yml); "/.github/actions/*"
    # covers the composite actions, which each have their own action.yml.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "3.7"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
