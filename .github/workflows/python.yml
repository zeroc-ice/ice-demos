name: Python

on:
  workflow_dispatch:
  push:
    branches: ["3.8"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["3.8"]

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format . --check --diff

  pyright:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pyright
        run: npm install -g pyright

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Run pyright on each demo
        run: |
          set -euo pipefail

          any_failed=0
          while read -r pyproject; do
            demo_dir=$(dirname "$pyproject")
            echo "===> Processing $demo_dir"

            pushd "$demo_dir" > /dev/null

            # Run slice2py if ../slice exists
            if [ -d ../slice ]; then
              echo "===> Running slice2py in $demo_dir"
              uv run slice2py ../slice/*.ice
            fi

            # Run pyright
            echo "===> Running pyright in $demo_dir"
            if ! uv run pyright .; then
              echo "❌ pyright failed in $demo_dir"
              any_failed=1
            else
              echo "✅ pyright passed in $demo_dir"
            fi
            popd > /dev/null
          done < <(find . -name pyproject.toml)

          if [ "$any_failed" -eq 1 ]; then
            echo "One or more pyright checks failed."
            exit 1
          fi
