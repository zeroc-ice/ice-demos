name: JavaScript

on:
  push:
    branches: ["3.8"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["3.8"]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run eslint and prettier
        working-directory: js
        run: |
          find . -name 'package.json' -not -path '*/node_modules/*' | while IFS= read -r file; do
            dir=$(dirname "$file")
            echo "::group::$dir"
            pushd "$dir"
            npm install
            npx prettier --check .
            npm run lint
            npm run build
            npm run typecheck
            popd
            echo "::endgroup::"
          done
